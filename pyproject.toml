[project]
name = "enterprise-detection-lab"
version = "0.0.1"
description = "A local, reproducible enterprise detection engineering lab."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Liam Carvajal" }]

dependencies = [
  "typer>=0.15.0",
  "rich>=13.9.0",
  "pyyaml>=6.0.2",
  "ruamel.yaml>=0.18.6",
  "jsonschema>=4.23.0",
  "httpx>=0.28.0",
  "duckdb>=1.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
edl = "edl.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edl"]

[tool.pytest.ini_options]
testpaths = ["tests", "detections"]
markers = ["lab: requires the local lab to be running"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/edl/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["edl"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
