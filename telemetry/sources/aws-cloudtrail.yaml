id: aws-cloudtrail
name: AWS CloudTrail management events
provider: Amazon Web Services
product: CloudTrail
event_classes:
  - management_event
  - api_activity
schema_version: "1.0"
status: ingested
owner: detection-engineering
event_time_field: eventTime
ingest_time_field: ingest_time
timezone: UTC
ordering: unordered
dedup_key:
  - eventID
required_fields:
  - eventTime
  - eventSource
  - eventName
  - userIdentity
  - sourceIPAddress
  - recipientAccountId
  - eventID
sensitive_fields:
  - userIdentity
  - requestParameters
  - sourceIPAddress
expected_volume: Management events only; data events are excluded from the lab.
expected_latency: Seconds to minutes; delivery can be delayed.
retention: Lab retains normalized events until reset; production retention is account-specific.
cost: First management-event copy is free; data events and extra copies cost money.
late_arrival: Expected; CloudTrail files are unordered.
duplicates: Possible; deduplicate by eventID.
known_gaps:
  - No real AWS account in the lab; synthetic events only.
  - Data events and GuardDuty findings are out of scope.
  - Organization trails and cross-account delivery are not replicated.
sample_data:
  path: lab/datasets/synthetic/aws-cloudtrail/reference.json
  synthetic: true
  license: synthetic
  provenance: Generated for this repository. No real accounts, principals, or keys.
  sha256: 5208849dd52ae458ce91fb00d8755ba39af1a761964dc64f52f1c8feb90fa065
notes: CloudTrail source contract.
