id: windows-security
name: Windows Security event log
provider: Microsoft
product: Windows
event_classes:
  - authentication
  - account_management
  - other
schema_version: "1.0"
status: ingested
owner: detection-engineering
event_time_field: TimeCreated
ingest_time_field: ingest_time
timezone: UTC
ordering: unordered
dedup_key:
  - EventRecordID
  - Computer
  - Channel
required_fields:
  - TimeCreated
  - EventID
  - Computer
  - EventRecordID
  - TargetUserName
  - IpAddress
  - LogonType
  - Status
  - Channel
sensitive_fields:
  - TargetUserName
  - IpAddress
  - SubjectUserName
expected_volume: Host and domain-controller dependent; the lab sample is intentionally small.
expected_latency: Seconds from the Windows event collector.
retention: Lab retains normalized events until reset.
cost: Included with Windows licensing; storage is the main lab cost.
late_arrival: Expected; preserve TimeCreated and synthetic ingest time.
duplicates: Possible; deduplicate by EventRecordID, Computer, and Channel.
known_gaps:
  - No live Windows VM yet; synthetic events only.
  - Advanced audit policy changes which events exist.
  - Domain-controller replication and log forwarding are not replicated.
sample_data:
