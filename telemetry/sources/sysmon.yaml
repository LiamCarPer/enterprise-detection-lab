id: sysmon
name: Microsoft Sysmon event logs
provider: Microsoft
product: Sysmon
event_classes:
  - process_creation
  - network_connection
  - file_create
  - registry_set
  - dns_query
  - process_access
  - other
schema_version: "1.0"
status: ingested
owner: detection-engineering
event_time_field: UtcTime
ingest_time_field: ingest_time
timezone: UTC
ordering: unordered
dedup_key:
  - EventRecordID
  - Computer
  - Channel
required_fields:
  - UtcTime
  - EventID
  - Computer
  - EventRecordID
  - ProcessGuid
  - Image
  - CommandLine
  - Channel
sensitive_fields:
  - CommandLine
  - User
  - TargetImage
expected_volume: Host-dependent; the lab sample is intentionally small.
expected_latency: Seconds from the Windows event collector.
retention: Lab retains normalized events until reset.
cost: Open source; Windows licensing and storage are the main cost.
late_arrival: Expected; UTC evtvmtime and collector ingest time differ.
duplicates: Possible; deduplicate by EventRecordID, Computer, and Channel.
known_gaps:
  - No live Windows VM yet; synthetic events only.
  - Sysmon configuration determines field coverage.
  - Image-load and process-access events are high volume and not fully sampled.
sample_data:
  path: lab/datasets/synthetic/sysmon/reference.json
  synthetic: true
  license: synthetic
  provenance: Generated for this repository. No real hosts or users.
  sha256: aa1da4571b0c806e9adbadaffa5872deed7abe1d8202b00ad320ee7c22ac9e3d
notes: Endpoint source contract.
