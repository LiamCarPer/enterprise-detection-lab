lessons:
  - A denied approval is a decision record, not proof that data left the tenant; the delivery event is required.
  - The approval, delivery, and DLP alert share a message identity, which links the decision to the exact delivered message.
  - The DLP alert confirms a sensitive-content policy match but does not by itself show that the recipient was unapproved.
  - The approval and DLP records share a content scope, so the denial is tied to the dataset that was delivered rather than to a different item.
  - Approval records do not always carry a message identifier, so the three-step join depends on integration design.
  - The remaining gap is request-scope matching, such as dataset or attachment identity, and a later-approval check.
response:
  - Preserve the approval, message-trace, and DLP records before cleanup.
  - Recall or remove the external message when the platform supports it.
  - Notify the data owner and follow the tenant's incident process for regulated data.
  - Review the sender's recent mail activity for additional external deliveries.
  - Confirm whether a later approval covers the same content and recipient.
references:
  - https://attack.mitre.org/techniques/T1048/003/
executive_summary: A synthetic data-handling chain shows an external-sharing request denied by the data owner, a delivery of the same customer dataset to the denied recipient, and a high-severity DLP alert on the delivered message and content scope. The approval decision, delivery, and alert share a message identity and scope, so the investigation can show that the denial was bypassed rather than infer it from timing alone.
notes: Synthetic investigation built from the local lab datasets. No production or customer data.
