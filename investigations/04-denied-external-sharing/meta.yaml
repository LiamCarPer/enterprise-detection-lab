id: INV-004
title: Denied Data-Sharing Exception to External Delivery
version: 1.0.0
status: tested
domains:
  - saas
scenario: A user requests approval to send a customer dataset to an external partner, is denied by the data owner, then delivers the same dataset to that partner and triggers a high-severity DLP alert on the delivered message and content scope.
hypothesis: A denied external-sharing decision followed by delivery to the same recipient, message, and content scope, with a DLP match, indicates that the data-handling decision was bypassed.
detections:
  - DET-SAA-008
  - DET-SAA-009
owner: detection-engineering
created: "2026-11-25"
updated: "2026-11-26"
evidence:
  - id: e1
    type: event
    source: servicenow-approval
    path: evidence/e1.json
    provenance: Synthetic event from lab/datasets/synthetic/servicenow-approval/reference.json
    description: ServiceNow approval REQ0007001 denied the external sharing request for customer-dataset.csv at 14:05 UTC.
    sha256: c8b2548bc877b80f9475fd08d5ee43c9830c0410ebfbfa2f1c18a4b06efc5a51
  - id: e2
    type: event
    source: exchange-message-trace
    path: evidence/e2.json
    provenance: Synthetic event from lab/datasets/synthetic/exchange-message-trace/reference.json
