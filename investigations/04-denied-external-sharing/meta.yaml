    event: External-sharing request REQ0007001 denied by the data owner
    source: servicenow-approval
    evidence_id: e1
  - timestamp: "2026-11-20T14:40:00Z"
    event: Customer dataset delivered to partner@example.org
    source: exchange-message-trace
