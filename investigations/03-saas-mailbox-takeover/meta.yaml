lessons:
  - The sign-in, delegation, access, and forwarding events share the analyst identity and source IP, but no token identifier proves a single session.
  - Exchange message trace is now in scope and confirms that the redirected message was delivered to an external recipient.
  - Self-delegation is a high-signal step and should be reviewed against approved mailbox administration.
  - The forwarding-rule update shows that a single rule-creation check is insufficient; updates need the same scrutiny.
  - A high-severity DLP alert on the same message confirms that a sensitive-content policy matched, but it does not prove the sender intent or whether the data was approved for external sharing.
  - The remaining gap is mailbox-owner confirmation and an approval decision for the external recipient.
response:
  - Revoke the analyst sessions and refresh tokens.
  - Remove the self-delegation and the external forwarding rule after preserving evidence.
  - Review the executive mailbox for message access, deletion, and forwarding activity.
  - Reset the analyst credentials and require MFA re-registration.
  - Review mailbox audit settings and forwarding controls for the affected mailbox.
  - Preserve the message-trace REDIRECT and DELIVER records and the DLP alert for the external recipient.
  - Confirm no other mailboxes were delegated or forwarded by the same identity.
