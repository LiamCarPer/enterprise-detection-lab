executive_summary: A synthetic SaaS chain shows a medium-risk sign-in, FullAccess self-delegation, mailbox access, two external forwarding-rule changes, an observed external delivery from an executive mailbox, and a high-severity DLP alert on the delivered message. The events are linked by analyst identity, source IP, mailbox, timing, and message identity; message trace confirms that mail left the tenant, and the DLP alert confirms a sensitive-content policy match.
notes: Synthetic investigation built from the local lab datasets. No production or customer data.
