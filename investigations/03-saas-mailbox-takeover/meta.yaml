executive_summary: A synthetic SaaS chain shows a medium-risk sign-in, FullAccess self-delegation, mailbox access, and two external forwarding-rule changes on an executive mailbox. The events are linked by analyst identity, source IP, mailbox, and timing; outbound delivery is not observed in the lab.
notes: Synthetic investigation built from the local lab datasets. No production or customer data.
