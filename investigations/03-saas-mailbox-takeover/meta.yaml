id: INV-003
title: SaaS Mailbox Takeover to External Forwarding
version: 1.0.0
status: tested
domains:
  - identity
  - saas
scenario: A medium-risk single-factor sign-in is followed by self-delegation, mailbox access, an external forwarding rule, and a forwarding-rule update for the same analyst on an executive mailbox.
hypothesis: An identity compromise may have been used to grant mailbox access, collect email, and establish durable external forwarding while hiding messages from the mailbox owner.
