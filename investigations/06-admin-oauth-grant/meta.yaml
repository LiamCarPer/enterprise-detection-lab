id: INV-006
title: Admin Consent and Tenant-Wide OAuth Grant
version: 1.0.0
status: tested
domains:
  - identity
  - saas
scenario: An administrator grants admin consent to an external application with an unverified publisher and untrusted redirect URI, then creates a tenant-wide OAuth permission grant for the same application.
hypothesis: An admin or tenant-wide OAuth grant to an untrusted application may provide durable access to tenant mail, files, or directory data.
detections:
  - DET-IDN-005
owner: detection-engineering
