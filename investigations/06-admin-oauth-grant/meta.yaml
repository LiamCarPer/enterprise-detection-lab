id: INV-006
title: Admin Consent and Tenant-Wide OAuth Grant
version: 1.1.0
status: tested
domains:
  - identity
  - saas
scenario: An administrator grants admin consent to an external application outside the approved inventory with an unverified publisher, untrusted redirect URI, and untrusted publisher reputation, then creates a tenant-wide OAuth permission grant for the same application.
hypothesis: An admin or tenant-wide OAuth grant to an untrusted application may provide durable access to tenant mail, files, or directory data.
