lessons:
  - Admin consent bypasses individual user consent and can expose the whole tenant.
  - Publisher verification, redirect-URI trust, and publisher reputation are explicit signals that should gate approval.
  - The grant record identifies the application and scopes, but not the application's intent.
  - A verified publisher can still be malicious or compromised.
  - The application is absent from the approved inventory and has an untrusted publisher reputation; the inventory and reputation feed must be maintained.
response:
  - Revoke the tenant-wide grant and refresh tokens.
  - Disable or remove the application service principal after preserving evidence.
  - Revoke application credentials and review granted permissions.
  - Review tenant-wide access to mail, files, and directory data.
  - Add the application to a tenant deny or approval workflow.
  - Reset administrator credentials if the grant is associated with a suspicious session.
references:
  - https://attack.mitre.org/techniques/T1528/
  - https://attack.mitre.org/techniques/T1098/
executive_summary: A synthetic identity chain shows an administrator granting consent to an external application outside the approved inventory with an unverified publisher, untrusted redirect URI, and untrusted publisher reputation, followed by a tenant-wide OAuth permission grant. The grants are observed; application intent and downstream access remain inferred.
notes: Synthetic investigation built from the local lab datasets. No production or customer data.
