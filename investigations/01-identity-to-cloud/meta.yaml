lessons:
  - The identity-to-cloud link is an inference based on the analyst identity, source IP, and timing; no AssumeRole event was observed.
  - Service principal ownership changes are broad and require an approval and owner check.
  - Access key creation and logging shutdown are high-signal cloud actions that should trigger immediate review.
  - The lab lacks email and endpoint context for the initial sign-in, limiting initial-access attribution.
  - The investigation query is evidence retrieval, not proof of a single actor.
response:
  - Revoke the analyst sessions and require credential reset.
  - Remove the unauthorized service principal owner and review application credentials and permissions.
  - Deactivate the new IAM access key and rotate the analyst credentials.
  - Re-enable CloudTrail logging and validate organization-trail coverage.
  - Review IAM policy and role changes for the same identity and source IP.
references:
  - https://attack.mitre.org/techniques/T1098/002/
  - https://attack.mitre.org/techniques/T1098/001/
  - https://attack.mitre.org/techniques/T1562/008/
executive_summary: A synthetic identity chain shows a risky sign-in, application ownership persistence, IAM access key creation, and CloudTrail logging shutdown. The observed events are linked by identity, IP, and timing; the actor attribution remains an inference.
notes: Synthetic investigation built from the local lab datasets. No production or customer data.
