id: INV-001
title: Identity Persistence to Cloud Credential Access
version: 1.0.0
status: tested
domains:
  - identity
  - cloud
scenario: A medium-risk single-factor sign-in is followed by service principal creation, owner assignment, IAM access key creation, and CloudTrail logging shutdown.
hypothesis: An identity compromise may have been used to establish application persistence and then create durable cloud credentials while reducing audit visibility.
