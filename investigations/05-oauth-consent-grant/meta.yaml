id: INV-005
title: OAuth Consent Grant to External Application
version: 1.1.0
status: tested
domains:
  - identity
  - saas
scenario: A medium-risk single-factor sign-in is followed by user consent to an external application outside the approved inventory with mail and offline-access scopes, then the application reads an executive mailbox.
hypothesis: Consent phishing or an illicit application grant may have provided durable access to mail without a second sign-in prompt.
detections:
  - DET-IDN-001
  - DET-IDN-004
owner: detection-engineering
