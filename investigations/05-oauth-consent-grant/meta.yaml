lessons:
  - User consent with offline access can create durable application access without another password prompt.
  - The consent record identifies the application and scopes, but not the application publisher's intent.
  - Mail access by the application is observed; token exchange and actor attribution remain inferred.
  - The application is absent from the approved inventory and has failed publisher and redirect trust; the inventory and reputation feed must be maintained.
  - Admin consent is a separate path and is intentionally excluded from this detection.
response:
  - Revoke the user's consent and refresh tokens.
  - Disable or remove the application service principal after preserving evidence.
  - Revoke application credentials and review granted permissions.
  - Review mailbox and file access for the application and other consenting users.
  - Reset the user's credentials if the originating sign-in is suspicious.
  - Add the application to a tenant deny or approval workflow.
references:
  - https://attack.mitre.org/techniques/T1078/
  - https://attack.mitre.org/techniques/T1528/
  - https://attack.mitre.org/techniques/T1114/002/
executive_summary: A synthetic identity chain shows a medium-risk single-factor sign-in, user consent to an external application outside the approved inventory with mail and offline-access scopes, and mail access by that application. The consent and access events are observed; token exchange and actor intent remain inferred.
notes: Synthetic investigation built from the local lab datasets. No production or customer data.
