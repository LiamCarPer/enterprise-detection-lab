timeline:
  - timestamp: "2026-11-01T10:00:00Z"
    event: Interactive MFA sign-in for analyst@example.test from the United States
    source: entra-signin
    evidence_id: e1
  - timestamp: "2026-11-01T10:15:00Z"
    event: Non-interactive high-risk sign-in from the Netherlands
    source: entra-signin
    evidence_id: e2
lessons:
  - The country change is the primary signal; the second sign-in's high risk raises confidence.
  - VPN, corporate proxy, or mobile-network egress can change the apparent country.
  - No travel or network-change context is present in the evidence.
  - The detection does not calculate distance or travel speed.
  - Device and token-protection signals would strengthen the conclusion.
response:
  - Revoke the user's sessions and refresh tokens.
  - Require credential reset and MFA re-registration if compromise is suspected.
  - Review mail, file, and cloud activity from the second country and IP.
  - Check for additional sessions or users from the second location.
  - Review conditional access and token-protection policy coverage.
references:
  - https://attack.mitre.org/techniques/T1078/
  - https://attack.mitre.org/techniques/T1550/001/
executive_summary: A synthetic identity chain shows an interactive MFA sign-in from the United States followed by a non-interactive high-risk sign-in from the Netherlands. The country change is observed; token theft and downstream access remain inferred.
notes: Synthetic investigation built from the local lab datasets. No production or customer data.
