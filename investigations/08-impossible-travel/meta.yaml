id: INV-008
title: Interactive Sign-In Followed by Risky Sign-In From a New Country
version: 1.0.0
status: tested
domains:
  - identity
scenario: A successful interactive MFA sign-in from the United States is followed by a non-interactive high-risk sign-in from the Netherlands within 15 minutes.
hypothesis: The user's session or credentials may have been used from an impossible location.
detections:
  - DET-IDN-001
  - DET-IDN-007
owner: detection-engineering
created: "2026-11-26"
updated: "2026-11-26"
