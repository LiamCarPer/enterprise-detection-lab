executive_summary: A synthetic endpoint chain shows encoded PowerShell, a failed network logon, IAM access key creation, and CloudTrail logging shutdown. The evidence is linked by host, user, IP, and timing; the endpoint-to-cloud identity link remains an inference.
notes: Synthetic investigation built from the local lab datasets. No production or customer data.
