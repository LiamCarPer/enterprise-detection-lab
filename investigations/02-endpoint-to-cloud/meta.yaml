lessons:
  - The endpoint-to-cloud link is an inference based on host, user, source IP, and timing; no shared process or token identifier was observed.
  - The encoded PowerShell command should be decoded and reviewed before confirming its role in the chain.
  - Failed logons after execution may indicate credential use or lateral movement and should be correlated with account activity.
  - Cloud key creation and logging shutdown are high-signal actions that warrant immediate containment.
  - The lab lacks EDR process ancestry and cloud identity-provider logs that would strengthen attribution.
response:
  - Isolate LAB-EP-01 after evidence capture.
  - Decode and preserve the PowerShell command and related process tree.
  - Deactivate the new IAM access key and rotate the analyst credentials.
  - Re-enable CloudTrail logging and verify organization-trail coverage.
  - Review Windows logon and cloud API activity from the same host, user, and source IP.
references:
  - https://attack.mitre.org/techniques/T1059/001/
