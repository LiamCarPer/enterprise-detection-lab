id: INV-002
title: Endpoint Execution to Cloud Persistence
version: 1.0.0
status: tested
domains:
  - endpoint
  - cloud
scenario: Encoded PowerShell on LAB-EP-01 is followed by a failed network logon, IAM access key creation, and CloudTrail logging shutdown.
hypothesis: An endpoint compromise may have provided the credentials or tooling used to establish cloud persistence and reduce audit visibility.
detections:
  - DET-END-001
  - DET-CLD-001
  - DET-CLD-002
