lessons:
  - User consent with offline access can create durable application access to files without another password prompt.
  - The consent record identifies the application and scopes, but not the application publisher's intent.
  - File access and download by the application are observed; token exchange and actor attribution remain inferred.
  - The application is absent from the approved inventory and has failed publisher and redirect trust; the inventory and reputation feed must be maintained.
  - Admin consent and tenant-wide grants are separate paths with different approval expectations.
response:
  - Revoke the user's consent and refresh tokens.
  - Disable or remove the application service principal after preserving evidence.
  - Revoke application credentials and review granted permissions.
  - Review SharePoint and OneDrive access for the application and other consenting users.
  - Remove external sharing or permission changes created by the application.
  - Reset the user's credentials if the originating session is suspicious.
  - Add the application to a tenant deny or approval workflow.
references:
  - https://attack.mitre.org/techniques/T1528/
  - https://attack.mitre.org/techniques/T1213/002/
executive_summary: A synthetic identity chain shows user consent to an external application with a file scope and offline access, followed by file access and download from a finance SharePoint site. The consent and file activity are observed; token exchange and actor intent remain inferred.
notes: Synthetic investigation built from the local lab datasets. No production or customer data.
