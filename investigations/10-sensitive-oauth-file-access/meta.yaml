id: INV-010
title: Sensitive OAuth Grant to Application File Access
version: 1.0.0
status: tested
domains:
  - identity
  - saas
scenario: A user consents to an external application with a file scope and offline access, then the application accesses and downloads a finance file from SharePoint.
hypothesis: Consent phishing or an illicit integration may have provided durable access to files without another sign-in prompt.
detections:
