id: DET-IDN-004
title: Risky Sign-In Followed by OAuth Consent Grant
version: 1.1.0
status: tested
domain: identity
severity: high
hypothesis: A risky single-factor sign-in followed by user consent to an application with offline access can indicate consent phishing and durable access to mail or files.
description: Correlates a successful elevated-risk single-factor sign-in with a successful user consent grant to an application outside the approved inventory that includes offline_access for the same user within 30 minutes.
owner: detection-engineering
created: "2026-11-26"
updated: "2026-11-27"
attack:
  - T1078
  - T1528
tags:
  - identity
  - entra-id
  - oauth
  - consent
  - correlation
telemetry:
  - source: entra-signin
    event_class: sign_in
    required_fields:
      - id
      - createdDateTime
      - userPrincipalName
      - appDisplayName
      - ipAddress
      - status
      - authenticationRequirement
      - isInteractive
      - riskLevelDuringSignIn
  - source: entra-audit
    event_class: audit
    required_fields:
      - id
      - activityDateTime
      - operationName
      - initiatedBy
      - targetResources
      - result
queries:
  opensearch: queries/opensearch.json
correlation:
  window_seconds: 1800
  group_by:
    - user
  steps:
    - source: entra-signin
      event_class: sign_in
      filters:
        all:
          result: success
          risk_level:
            - medium
            - high
          auth_requirement: singleFactorAuthentication
          is_interactive: true
    - source: entra-audit
      event_class: audit
      filters:
        all:
          action: Consent to application
          result: success
          consent_type: user
          offline_access: true
          resource.type: ServicePrincipal
          approved_app: false
tests:
  positive: 4
  negative: 8
  benign: 4
false_positives:
  - Unreviewed but legitimate application onboarding that uses user consent with offline access.
  - A legitimate personal-productivity application that the user intended to connect.
  - A risk false positive followed by an approved consent workflow.
runbook: runbook.md
metrics: metrics.json
notes: notes.md
