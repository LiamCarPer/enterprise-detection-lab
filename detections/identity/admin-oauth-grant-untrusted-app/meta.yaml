id: DET-IDN-005
title: Admin or Tenant OAuth Grant to Untrusted Application
version: 1.0.0
status: tested
domain: identity
severity: high
hypothesis: An admin or tenant-wide OAuth grant to an application with an unverified publisher or untrusted redirect URI can establish durable tenant-wide access.
description: Detects a successful admin or tenant consent, or a tenant-wide permission grant, where the target application has an unverified publisher or an untrusted redirect URI.
owner: detection-engineering
created: "2026-11-26"
updated: "2026-11-26"
attack:
  - T1528
  - T1098
tags:
  - identity
  - entra-id
  - oauth
  - consent
  - admin
telemetry:
  - source: entra-audit
    event_class: audit
    required_fields:
      - id
      - activityDateTime
      - operationName
      - initiatedBy
      - targetResources
      - result
queries:
  opensearch: queries/opensearch.json
tests:
  positive: 5
  negative: 5
  benign: 5
false_positives:
  - Approved internal application onboarding before publisher verification completes.
  - A tenant-wide grant to a verified application whose redirect URI is not yet in the trusted inventory.
  - A break-glass or emergency application grant with an approved change record.
runbook: runbook.md
metrics: metrics.json
notes: notes.md
