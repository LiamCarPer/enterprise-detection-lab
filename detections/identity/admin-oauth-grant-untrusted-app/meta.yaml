id: DET-IDN-005
title: Admin or Tenant OAuth Grant to Untrusted Application
version: 1.1.0
status: tested
domain: identity
severity: high
hypothesis: An admin or tenant-wide OAuth grant to an application outside the approved inventory, with an unverified publisher, untrusted redirect URI, or untrusted publisher reputation, can establish durable tenant-wide access.
description: Detects a successful admin or tenant consent, or a tenant-wide permission grant, where the target application is not in the approved inventory and has an unverified publisher, an untrusted redirect URI, or an untrusted publisher reputation.
owner: detection-engineering
created: "2026-11-26"
updated: "2026-11-27"
attack:
  - T1528
  - T1098
tags:
  - identity
  - entra-id
  - oauth
  - consent
  - admin
telemetry:
  - source: entra-audit
    event_class: audit
    required_fields:
      - id
      - activityDateTime
      - operationName
      - initiatedBy
      - targetResources
      - result
queries:
  opensearch: queries/opensearch.json
tests:
  positive: 6
  negative: 6
  benign: 5
false_positives:
  - Approved internal application onboarding before publisher verification completes; the approved inventory suppresses it only when the redirect URI also matches.
  - A tenant-wide grant to a verified application whose redirect URI is not yet in the trusted inventory and that is not approved.
  - A break-glass or emergency application grant with an approved change record.
runbook: runbook.md
metrics: metrics.json
notes: notes.md
