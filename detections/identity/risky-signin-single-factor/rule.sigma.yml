title: Successful Risky Sign-In With Single-Factor Authentication
id: 00000000-0000-4000-8000-000000000101
status: test
description: Detects a successful interactive Entra ID sign-in with medium or high risk and single-factor authentication.
author: detection-engineering
date: 2026/11/23
logsource:
  product: azure
  service: signinlogs
detection:
  selection:
    status: success
    riskLevelDuringSignIn:
      - medium
      - high
    authenticationRequirement: singleFactorAuthentication
    isInteractive: true
  condition: selection
falsepositives:
  - Legitimate travel with an elevated risk score
  - Risk false positive followed by successful MFA
level: high
tags:
  - attack.t1078
