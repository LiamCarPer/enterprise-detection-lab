id: DET-IDN-011
title: Sensitive OAuth Grant Followed by Application Teams Activity
version: 1.0.0
status: tested
domain: identity
severity: high
hypothesis: A consent or OAuth permission grant to an unapproved application with Teams scopes and offline access, followed by Teams activity by that application, can indicate consent phishing and application abuse.
description: Correlates a successful Entra audit consent or OAuth permission grant to an application outside the approved inventory with a sensitive Teams scope and offline access, followed by successful Microsoft 365 Teams activity by the same application within 60 minutes.
owner: detection-engineering
created: "2026-11-28"
updated: "2026-11-28"
attack:
  - T1528
  - T1213
tags:
  - identity
  - entra-id
  - oauth
  - consent
  - microsoft-365
  - teams
  - correlation
telemetry:
  - source: entra-audit
    event_class: audit
    required_fields:
      - id
      - activityDateTime
      - operationName
      - initiatedBy
      - targetResources
      - result
  - source: m365-audit
    event_class: teams
    required_fields:
      - CreationTime
      - Id
      - Operation
      - UserId
      - Workload
      - RecordType
      - ResultStatus
queries:
  opensearch: queries/opensearch.json
correlation:
  window_seconds: 3600
  group_by:
    - app_identity
  steps:
    - source: entra-audit
      event_class: audit
      filters:
        all:
          action:
            - Consent to application
            - Add OAuth2PermissionGrant
            - Add delegated permission grant
          result: success
          approved_app: false
          sensitive_scope: true
          scope_categories: teams
          offline_access: true
    - source: m365-audit
      event_class: teams
      filters:
        all:
          action:
            - ChatCreated
            - MessageRead
            - MessageSent
            - TeamCreated
          result: success
          app_access: true
tests:
  positive: 6
  negative: 12
  benign: 4
false_positives:
  - An unreviewed but legitimate Teams application that the user intended to connect.
  - An approved application whose inventory entry is stale or whose redirect URI changed.
  - A production integration whose consent was granted outside the normal approval workflow.
runbook: runbook.md
metrics: metrics.json
notes: notes.md
