id: DET-SAA-004
title: Risky Sign-In Followed by Mailbox or Group Delegation
version: 1.0.0
status: tested
domain: saas
severity: high
hypothesis: A risky single-factor sign-in followed by a FullAccess mailbox delegation within an hour can indicate account compromise and email collection.
description: Correlates an elevated-risk single-factor sign-in with a successful Microsoft 365 mailbox grant, high-privilege folder permission, or distribution-group membership addition for the same user within 60 minutes.
owner: detection-engineering
created: "2026-11-25"
updated: "2026-11-25"
attack:
  - T1078
  - T1098
  - T1114.002
tags:
  - saas
  - microsoft-365
  - identity
  - correlation
telemetry:
  - source: entra-signin
    event_class: sign_in
    required_fields:
      - id
      - createdDateTime
      - userPrincipalName
      - status
      - authenticationRequirement
      - isInteractive
      - riskLevelDuringSignIn
  - source: m365-audit
    event_class: mailbox
    required_fields:
      - CreationTime
      - Id
      - Operation
      - UserId
      - Workload
      - RecordType
      - ResultStatus
      - Parameters
queries:
  opensearch: queries/opensearch.json
correlation:
  window_seconds: 3600
  group_by:
    - user
  steps:
    - source: entra-signin
      event_class: sign_in
    - source: m365-audit
      event_class: mailbox_permission
tests:
  positive: 8
  negative: 8
  benign: 8
false_positives:
  - An approved delegation request after legitimate travel or a new device.
  - A risk false positive followed by helpdesk mailbox administration.
  - Break-glass or emergency mailbox access during an incident.
runbook: runbook.md
metrics: metrics.json
notes: notes.md
