id: DET-SAA-005
title: Risky Sign-In, Self-Delegation, and Mail Access
version: 1.0.0
status: tested
domain: saas
severity: high
hypothesis: A risky sign-in followed by a self-granted mailbox permission and then mailbox access indicates account takeover and email collection.
description: Correlates an elevated-risk single-factor sign-in, a self-delegation permission grant, and a successful mailbox access by the same user within 60 minutes.
owner: detection-engineering
created: "2026-11-25"
updated: "2026-11-25"
attack:
  - T1078
  - T1098
  - T1114.002
tags:
  - saas
  - microsoft-365
  - identity
  - correlation
telemetry:
  - source: entra-signin
    event_class: sign_in
    required_fields:
      - id
      - createdDateTime
      - userPrincipalName
      - status
      - authenticationRequirement
      - isInteractive
      - riskLevelDuringSignIn
  - source: m365-audit
    event_class: mailbox_permission
    required_fields:
      - CreationTime
      - Id
      - Operation
      - UserId
      - Workload
      - RecordType
      - ResultStatus
      - Parameters
  - source: m365-audit
    event_class: mail_access
    required_fields:
      - CreationTime
      - Id
      - Operation
      - UserId
      - Workload
      - RecordType
      - ResultStatus
      - ObjectId
queries:
  opensearch: queries/opensearch.json
correlation:
  window_seconds: 3600
  group_by:
    - user
  steps:
    - source: entra-signin
      event_class: sign_in
    - source: m365-audit
      event_class: mailbox_permission
      match_fields:
        - mailbox
    - source: m365-audit
      event_class: mail_access
      match_fields:
        - mailbox
tests:
  positive: 6
  negative: 9
  benign: 5
false_positives:
  - A legitimate user grants themselves access to a shared mailbox after traveling.
  - A risk false positive followed by approved mailbox access.
  - Break-glass administration during an incident.
runbook: runbook.md
metrics: metrics.json
notes: notes.md
