title: External Inbox Rule Mail Forwarding
id: 00000000-0000-4000-8000-000000000401
status: test
description: Detects a successful Microsoft 365 inbox rule that forwards or redirects mail to an external domain.
author: detection-engineering
date: 2026/11/25
logsource:
  product: m365
  service: audit
detection:
  selection:
    Workload: Exchange
    Operation:
      - New-InboxRule
      - Set-InboxRule
      - UpdateInboxRules
    ResultStatus: Success
  selection_forward_parameters:
    Parameters|contains:
      - ForwardTo
      - RedirectTo
      - ForwardAsAttachmentTo
  selection_forward_properties:
    OperationProperties|contains:
      - ForwardToRecipientsAction
      - RedirectToRecipientsAction
      - ForwardAsAttachmentToRecipientsAction
  condition: selection and 1 of selection_forward_*
falsepositives:
  - Legitimate user forwarding rules
  - Approved mailbox workflows
level: high
tags:
  - attack.t1114.003
