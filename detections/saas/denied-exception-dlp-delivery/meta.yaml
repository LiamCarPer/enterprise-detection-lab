id: DET-SAA-009
title: Denied or Revoked Exception Followed by DLP-Confirmed External Delivery
version: 1.0.0
status: tested
domain: saas
severity: critical
hypothesis: An explicit denial or revocation of an external-sharing exception followed by delivery to the same recipient and a DLP match indicates that the data-handling decision was bypassed.
description: Correlates a denied or revoked ServiceNow approval, a successful external Exchange Online delivery to the same mailbox and recipient, and an active high-severity Purview DLP alert for the same message and content scope within 24 hours. An active, unexpired later approved request for the same mailbox, recipient, and content scope suppresses the sequence for up to seven days.
owner: detection-engineering
created: "2026-11-25"
updated: "2026-11-26"
attack:
  - T1048.003
tags:
  - saas
  - servicenow
  - exchange-online
  - purview
  - dlp
  - exfiltration
  - correlation
telemetry:
  - source: servicenow-approval
    event_class: approval
    required_fields:
      - sys_id
      - number
      - sys_updated_on
      - state
      - approval
      - requested_for
      - recipient
      - message_id
      - content_scope
      - short_description
      - approver
  - source: exchange-message-trace
    event_class: deliver
    required_fields:
      - MessageTraceId
      - MessageId
      - SenderAddress
      - RecipientAddress
      - Date
      - Event
      - Status
      - RelatedRecipientAddress
      - TenantId
  - source: m365-dlp
    event_class: dlp_alert
    required_fields:
      - AlertId
      - CreationTime
      - PolicyName
      - Status
      - User
      - MessageId
      - Severity
      - Workload
      - Recipient
      - ContentScope
      - Action
queries:
  opensearch: queries/opensearch.json
correlation:
  window_seconds: 86400
  group_by:
    - delivery_recipient
  steps:
    - source: servicenow-approval
      event_class: approval
      filters:
        any_of:
          - decision: denied
          - decision: revoked
      match_fields:
        - mailbox
        - delivery_recipient
        - message_id
        - content_scope
    - source: exchange-message-trace
      event_class: deliver
      filters:
        all:
          result: success
          external_recipient: true
      match_fields:
        - mailbox
        - delivery_recipient
        - message_id
    - source: m365-dlp
      event_class: dlp_alert
      filters:
        all:
          status: active
          severity: high
          workload: Exchange
      match_fields:
        - message_id
        - content_scope
    - source: servicenow-approval
      event_class: approval
      exclude: true
      window_seconds: 604800
      valid_until_field: expires_on
      filters:
        all:
          decision: approved
          status: active
      match_fields:
        - mailbox
        - delivery_recipient
        - content_scope
tests:
  positive: 17
  negative: 19
  benign: 3
false_positives:
  - An approval was denied or revoked for one dataset but a later request for the same content was approved.
  - A delivery used an approved exception that was recorded under a different request or message identifier.
  - A DLP policy matched a message that the data owner later approved retrospectively.
runbook: runbook.md
metrics: metrics.json
notes: notes.md
