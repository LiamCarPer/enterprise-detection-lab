title: Encoded PowerShell From Non-PowerShell Parent
id: 00000000-0000-4000-8000-000000000201
status: test
description: Detects encoded PowerShell or pwsh execution where the parent is not another PowerShell host.
author: detection-engineering
date: 2026/11/23
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith:
      - '\\powershell.exe'
      - '\\pwsh.exe'
    CommandLine|contains: 'EncodedCommand'
  filter:
    ParentImage|endswith:
      - '\\powershell.exe'
      - '\\pwsh.exe'
      - '\\corpmgmt.exe'
  condition: selection and not filter
falsepositives:
  - Approved administrative or deployment scripts
  - Security testing
level: high
tags:
  - attack.t1059.001
  - attack.t1027
