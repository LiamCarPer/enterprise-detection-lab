title: Office Application Spawns Scripting Host
id: 00000000-0000-4000-8000-000000000202
status: test
description: Detects Microsoft Office applications spawning PowerShell, cmd, or common script hosts.
author: detection-engineering
date: 2026/11/23
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentImage|endswith:
      - '\\WINWORD.EXE'
      - '\\EXCEL.EXE'
      - '\\OUTLOOK.EXE'
      - '\\POWERPNT.EXE'
      - '\\MSACCESS.EXE'
      - '\\ONENOTE.EXE'
      - '\\VISIO.EXE'
    Image|endswith:
      - '\\powershell.exe'
      - '\\pwsh.exe'
      - '\\cmd.exe'
      - '\\wscript.exe'
      - '\\cscript.exe'
      - '\\mshta.exe'
  condition: selection
falsepositives:
  - Approved Office macros or add-ins
  - Security testing
level: high
tags:
  - attack.t1566.001
  - attack.t1059.001
  - attack.t1204.002
