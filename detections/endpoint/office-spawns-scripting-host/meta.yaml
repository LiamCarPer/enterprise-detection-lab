id: DET-END-002
title: Office Application Spawns Scripting Host
version: 1.0.0
status: tested
domain: endpoint
severity: high
hypothesis: A Microsoft Office application spawning PowerShell, cmd, or a script host can indicate a malicious document or a compromised add-in.
description: Detects Office applications creating common scripting and command interpreters.
owner: detection-engineering
created: "2026-11-23"
updated: "2026-11-23"
attack:
  - T1566.001
  - T1059.001
  - T1204.002
tags:
  - endpoint
  - sysmon
  - office
telemetry:
  - source: sysmon
    event_class: process_creation
    required_fields:
      - UtcTime
      - EventID
      - Computer
      - EventRecordID
      - ProcessGuid
      - Image
      - CommandLine
      - ParentImage
      - Channel
queries:
  opensearch: queries/opensearch.json
tests:
  positive: 5
  negative: 5
  benign: 5
false_positives:
  - Approved Office macros or add-ins that launch scripts.
  - Document management tools that wrap Office with a scripting host.
  - Security testing or controlled malware analysis.
runbook: runbook.md
metrics: metrics.json
notes: notes.md
